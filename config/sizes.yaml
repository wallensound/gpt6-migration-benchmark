splits: {train: 120, dev: 200, test: 300, shift: 150}
overgenerate: 1.3
max_drop_rate: 0.20
near_dup_threshold: 0.8
calibration_floor: {default: 0.90, '05': 0.85, '08': 0.85}
calibration_max_rounds: 4
loop:
  rounds: 5
  candidates: 4
  screen_items: 60
  early_stop_empty_rounds: 2
  screen_max_trail: 0.03
  screen_min_validity: 0.98
  accept_alpha: 0.05
  accept_max_slice_drop: 0.02
  accept_min_validity: 0.99
  examples_per_pattern: 3
  top_patterns: 3
seeds: [11, 22, 33]
bootstrap_resamples: 2000
noninferiority_margin: 0.03
stability_repeats: 3
