# Model names, per-provider model IDs, efforts, prices and concurrency caps.
# Which provider each model uses comes from the environment (see .env.example), never from this file.
# `make check-models` probes every model and rewrites the `probed` blocks.
reference_date: '2026-11-17'
providers:
  openai:
    base_url_env: OPENAI_BASE_URL
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    auth: bearer
    note: Default. OpenAI API; only OPENAI_API_KEY is needed.
  azure:
    base_url_env: AZURE_OPENAI_BASE_URL
    base_url: null
    key_env: AZURE_OPENAI_API_KEY
    auth: api-key
    note: Azure OpenAI v1 endpoint, e.g. https://<your-resource>.openai.azure.com/openai/v1. Model IDs are your
      deployment names (override with BENCH_MODEL_ID_<MODEL>).
  bedrock:
    base_url_env: BEDROCK_OPENAI_BASE_URL
    base_url: https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1
    key_env: AWS_BEARER_TOKEN_BEDROCK
    auth: bearer
    note: AWS Bedrock OpenAI-compatible endpoint with a Bedrock API key. Does not return logprobs.
  compatible:
    base_url_env: COMPATIBLE_BASE_URL
    base_url: null
    key_env: COMPATIBLE_API_KEY
    auth: bearer
    note: Any other OpenAI-compatible gateway (LiteLLM, OpenRouter, a proxy).
pricing:
  cached_input_multiplier: 0.1
  cache_write_multiplier: 1.25
  note: Prices per 1M tokens (OpenAI list prices on 2026-11-17; Flex for Terra and Luna). Your provider may bill
    differently.
models:
  gpt-5.6-sol:
    role: source
    ids:
      openai: gpt-5.6-sol
      azure: gpt-5.6-sol
      bedrock: global.openai.gpt-5.6-sol
    api: chat
    efforts:
    - none
    price_in: 4.0
    price_out: 20.0
    tier: standard
    concurrency: 20
    probed:
      checked_at: '2026-11-18T00:37:17'
      supported_efforts:
      - none
      - low
      - medium
      - high
      - xhigh
      rejected_efforts:
        minimal: 'Unsupported value: ''reasoning_effort'' does not support ''minimal'' with this model. Supported
          values are: ''none'', ''low'', ''medium'', ''high'', and ''xhigh''.'
        max: 'Unsupported value: ''reasoning_effort'' does not support ''max'' with this model. Supported values
          are: ''none'', ''low'', ''medium'', ''high'', and ''xhigh''.'
      resolved_model: gpt-5.6-sol-2026-07-09
      temperature_0: true
      logprobs_returned: true
      response_format_json_schema: true
      brief_efforts_missing: []
