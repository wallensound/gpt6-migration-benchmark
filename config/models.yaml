provider_selection:
  default_env: BENCH_PROVIDER
  default: openai
  note: Every model uses BENCH_PROVIDER (default openai). Override one model with BENCH_PROVIDER_<MODEL>, e.g. BENCH_PROVIDER_GPT_5_6_SOL=azure,
    and its ID with BENCH_MODEL_ID_<MODEL>. <MODEL> is the model name upper-cased with - and . replaced by _.
